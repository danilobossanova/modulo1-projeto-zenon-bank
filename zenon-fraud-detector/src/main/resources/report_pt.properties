# Cabecalhos do relatorio de transacoes, em portugues.
#
# Este arquivo esta em UTF-8. A partir do Java 9 o ResourceBundle le .properties
# como UTF-8, com recuo automatico para ISO-8859-1 se a decodificacao falhar.
# Em Java 8 e anteriores seria obrigatorio escapar os acentos como \uXXXX, e um
# arquivo UTF-8 apareceria com caracteres corrompidos na saida.
#
# O nome do arquivo usa apenas o idioma (report_pt), e nao o pais (report_pt_BR),
# porque traducao e uma questao de idioma. A moeda e o formato dos numeros, que
# dependem do pais, vem do Locale escolhido na ReportMain e nao deste arquivo.

report.totalLines=Total de linhas
report.totalFrauds=Total de fraudes
report.totalAmount=Valor total transacionado
